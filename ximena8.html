<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>Peliculas API</title>
</head>
<body>
    <style>
        *{
            box-sizing: border-box;
        }
        :root{
    --color-primario: #0555ce;
    --color-secundario: #ffb3c6;
    --color-terciario: #ebc72b;
    --color-cuarto: #f16a1c;
    --color-quinto: #f1620f;
    
        }
        body{
            background-color: var(--color-primario);
            font-family: 'segoe UI', Tahoma, Geneva, Verdana, san-serif;
            margin: 0;
        }
        header{
            padding: 16px;
            display: flex;
            justify-content: flex-end;
            background-color: var(--color-cuarto);
        }
        .search{
            background-color: rgb(252, 252, 252);
            border: 5px solid var(--color-terciario);
            border-radius: 50px;
            font-family: verdana, Geneva, Tahoma, sans-serif;
            font-size: 15px;
            padding: 10px 16px;
            color: var(--color-terciaro);
        }
        .search::placeholder{
            color: var(--color-quinto);
        }
        .search:focus{
            outline: none;
            background-color: var(--color-primario);
        }
        main{
            display: flex;
            flex-wrap: wrap;
            justify-content: center; 
        }
        .personaje{
            width: 300px;
            margin: 15px;
            background-color: var(--color-secundario);
            box-shadow: 10px 15px 5px black;
            position: relative;
            overflow: hidden;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
        }
        .personaje img{
            width: 100%;
            height: 400px;
            object-fit: contain;
        }
        .personajes-info{
            color: var(--color-quinto);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4px;
            padding: 0.8px 15px 15px;
            letter-spacing: 8px;
        }
        .personaje-info h3{
            color: var(--color-primario);
            margin-top: 0;
        }
        .movie-info span{
            background-color: var(--color-primario);
            padding:5px 8px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .overview{
            background-color: #1b2dc9;
            padding: 15px;
            position: absolute;
            left: 0;
            bottom: 0;
            right: 0;
            max-height: 100%;
            transform: translateY(101%);
            overflow-y: auto;
            transition: transform 1s ease-in;
        }
        .personaje:hover .overview{
            transform: translateY(0);}
    </style>

    <header>
        <img src="logo2.jpg" alt="logo" style="width: 100px;">
        <form id="form">
            <input type="text" id="search" class="search" placeholder="Buscar pelicula">
        </form>
    </header>
    <main id="main"></main>
    <script>
        const API_URL ="https://dragonball-api.com/api/characters";
        const main = document.getElementById('main');
        const form = document.getElementById('form');
        const search = document.getElementById('search');

        getCharacters(API_URL)
        
        async function getCharacters(url){
            const res = await fetch(url);
            const data = await res.json();

            showCharacters(data.items||data);
        }
        function showCharacters(Characters){
            main.innerHTML = '';

            Characters.forEach((char) =>{
                //esta linea va a poner todos los elementos al principio, para eso el forEach, es similar al "for", pero el for tiene su inicializacion, condicion y limitante
                const {id, name, image, ki, maxki,race, gender, description} = movie;
                //esta linea pone lo que nos va a interesar del API que vamos a obtener
                const charElements = document.createElement('div');
                charElements.classList.add('personaje');
                charElements.innerHTML =`
                <img src = "${image}" alt="${title}">
                <div class="personaje-info">
                    <h1>${id}</h1>
                    <h3>${name}</h3>
                  <br>
                  ${race}
                  </div>
                  <div class= "overview">
                    <h3>Descripcion</h3>
                    <p><strong>Ki:</strong>${ki}</p>

                    ${descripcion}
                            </div>`
                            main.appendChild(charElements);
            });}
        
                form.addEventListener('submit', (e) =>{

                    if(searchTerm && searchTerm !==''){
                        getCharacters(SEARCH_API +  `7name=${searchTerm}`)
                        search.value='';
                    }else{ window.location.reload();}
                })
    </script>
</body>

</html>
